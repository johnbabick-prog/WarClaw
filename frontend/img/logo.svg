<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 248 48" fill="none">
  <defs>
    <linearGradient id="erGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#e84020"/>
      <stop offset="100%" stop-color="#a01808"/>
    </linearGradient>
  </defs>

  <!-- ER geometric mark -->
  <!-- Vertical left bar -->
  <rect x="2"  y="6"  width="8"  height="36" rx="1" fill="url(#erGrad)"/>
  <!-- Top horizontal bar -->
  <rect x="10" y="6"  width="20" height="7"  rx="1" fill="url(#erGrad)"/>
  <!-- Bowl right cap -->
  <rect x="30" y="6"  width="6"  height="17" rx="1" fill="url(#erGrad)"/>
  <!-- Mid horizontal bar -->
  <rect x="10" y="20" width="20" height="7"  rx="1" fill="url(#erGrad)"/>
  <!-- Diagonal leg -->
  <polygon points="30,27 38,27 44,42 36,42" fill="url(#erGrad)"/>
  <!-- Short bottom-left leg -->
  <rect x="10" y="35" width="8"  height="7"  rx="1" fill="url(#erGrad)"/>

  <!-- Wordmark: "edgerunner" light cream, "AI" gray -->
  <text x="54" y="34"
        font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif"
        font-size="21" font-weight="700" letter-spacing="-0.3"
        fill="#e8e4e0">edgerunner</text>
  <text x="198" y="34"
        font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif"
        font-size="17" font-weight="400" letter-spacing="2"
        fill="#888888">AI</text>
</svg>
